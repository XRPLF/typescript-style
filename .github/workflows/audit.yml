name: Dependency audit

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Re-run weekly so newly-disclosed advisories are caught even without code changes.
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Fail on high/critical vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install npm 10
        run: npm i -g npm@10 --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
